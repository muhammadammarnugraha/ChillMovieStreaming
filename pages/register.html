<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Chill Streaming Movie</title>
    <link rel="stylesheet" href="/styles/register.css">
</head>
<body>
    <main>
        <form class="card-container" action="#">
            <img class="mini-logo" src="../images/Logo.png" alt="mini-logo">
        
            <div class="card-title">
                <p id="masuk">Daftar</p>
                <p>Selamat Datang!</p>
            </div>
        
            <div class="card-form">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" name="username" placeholder="Masukkan username"/>
            </div>

            <div class="card-form">
                <label class="form-label" for="password">Kata Sandi</label>
                <input class="form-input" type="text" name="password" placeholder="Masukkan kata sandi"/>
                <img id="password-icon1" class="password-icon" src="../images/eye-off.png" alt="ikon mata">
            </div>
        
            <div class="card-form">
                <label class="form-label" for="repassword">Konfirmasi Kata Sandi</label>
                <input class="form-input" type="text" name="repassword" placeholder="Masukkan kata sandi"/>
                <img id="password-icon2" class="password-icon" src="../images/eye-off.png" alt="ikon mata">
                <div class="form-footer">
                    <p class="gray-font">Sudah punya akun? <a class="unanchor" href="../index.html">Masuk</a></p>
                </div>
            </div>
    
            <div class="card-form">
                <button class="form-button card-form form-input gray-background" type="submit">Daftar</button>
                <p id="atau" class="gray-font">Atau</p>
                <button class="form-button card-form form-input">
                <img id="google" src="../images/google.png" alt="Google">
                <p>Daftar dengan Google</p>
                </button>
            </div>   
        </form>
    </main>
    
</body>
</html>
